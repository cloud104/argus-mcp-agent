# =============================================================================
# Argus Agent - Sandbox Environment Configuration
# Namespace: argus
# Environment: sandbox.tcloud-devops.cloudtotvs.com.br
# =============================================================================

# Global settings
global:
  namespace: argus

# Image configuration
image:
  registry: southamerica-east1-docker.pkg.dev/tcloud-devops/tcloud-devops
  repository: argus-api
  tag: "20251005-000416"
  pullPolicy: IfNotPresent
  pullSecrets:
    - name: gcr-json-key

# MCP Server configuration
mcpServer:
  enabled: true
  name: argus-mcp-server
  replicaCount: 1

  image:
    registry: southamerica-east1-docker.pkg.dev/tcloud-devops/tcloud-devops
    repository: argus-mcp-server
    tag: "20251005-000416"
    pullSecrets:
      - name: gcr-json-key

  service:
    type: ClusterIP
    port: 8002
    targetPort: 8002
    annotations: {}

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  livenessProbe:
    httpGet:
      path: /health/live
      port: 8002
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /health/ready
      port: 8002
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# API Application configuration
api:
  enabled: true
  name: argus-api
  replicaCount: 1

  image:
    registry: southamerica-east1-docker.pkg.dev/tcloud-devops/tcloud-devops
    repository: argus-api
    tag: "20251005-000416"
    pullSecrets:
      - name: gcr-json-key

  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
    annotations: {}

  resources:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  livenessProbe:
    httpGet:
      path: /health/live
      port: 8000
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /health/ready
      port: 8000
    initialDelaySeconds: 15
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  autoscaling:
    enabled: false

# UI configuration
ui:
  enabled: true
  name: argus-ui
  replicaCount: 1

  image:
    registry: southamerica-east1-docker.pkg.dev/tcloud-devops/tcloud-devops
    repository: argus-ui
    tag: "20251005-000416"
    pullSecrets:
      - name: gcr-json-key

  service:
    type: ClusterIP
    port: 80
    targetPort: 80
    annotations: {}

  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

  livenessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# PostgreSQL configuration
postgresql:
  enabled: true
  name: argus-postgres
  replicaCount: 1

  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 5432
    annotations: {}

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  livenessProbe:
    exec:
      command:
        - pg_isready
        - -U
        - argus
        - -d
        - argus_auth
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    exec:
      command:
        - pg_isready
        - -U
        - argus
        - -d
        - argus_auth
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  extraEnv: []

# ChromaDB configuration
chromadb:
  enabled: true
  name: argus-chromadb
  replicaCount: 1

  image:
    repository: chromadb/chroma
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8000
    annotations: {}

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  # Using TCP probes instead of HTTP (v1 API deprecated)
  livenessProbe:
    httpGet: null
    tcpSocket:
      port: 8000
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet: null
    tcpSocket:
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  extraEnv: []

# Ingress configuration
ingress:
  enabled: true
  className: ""  # Empty - using annotation instead (legacy cluster without IngressClass)
  annotations:
    kubernetes.io/ingress.class: "nginx"  # Legacy annotation for clusters without IngressClass
    nginx.ingress.kubernetes.io/ssl-redirect: "true"  # Force HTTPS redirect
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"  # Ensure SSL redirect
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "900"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "900"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "900"
  host: argus.sandbox.tcloud-devops.cloudtotvs.com.br
  paths:
    api:
      path: /api
      pathType: Prefix
    mcp:
      path: /mcp
      pathType: Prefix
    ui:
      path: /
      pathType: Prefix

# Storage configuration (only for postgres and chromadb)
storage:
  chroma:
    enabled: true
    size: 10Gi
    storageClassName: "longhorn"
    accessMode: ReadWriteOnce

  postgres:
    enabled: true
    size: 10Gi
    storageClassName: "longhorn"
    accessMode: ReadWriteOnce

# Configuration
config:
  # MCP Server URL (will be templated)
  mcpServerUrl: "http://argus-agent-mcp-server:8002/mcp/"

  # ChromaDB URL (if using standalone ChromaDB)
  chromadbUrl: "http://argus-agent-chromadb:8000"

  # Models configuration
  models:
    plannerModel:
      provider: "openai"
      classPath: "langchain_openai.ChatOpenAI"
      modelName: "gpt-4o-mini"

    synthesizerModel:
      provider: "openai"
      classPath: "langchain_openai.ChatOpenAI"
      modelName: "gpt-4o"

    chatModel:
      provider: "openai"
      classPath: "langchain_openai.ChatOpenAI"
      modelName: "claude-sonnet-4"
      maxTokens: 4096

# Secrets (should be provided via values override or external secrets)
secrets:
  # Create secret from values (not recommended for production)
  create: false
  # Use existing secret
  existingSecret: "argus-secrets"

  # If create=true, provide these values
  openaiApiKey: ""
  googleApiKey: ""
  anthropicApiKey: ""

  elasticsearch:
    host: ""
    user: ""
    password: ""

# Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532

# Pod annotations
podAnnotations: {}

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""
