{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "argus-agent.fullname" . }}-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "argus-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  # LLM API Configuration
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  OPENAI_BASE_URL: "https://proxy.dta.totvs.ai"
  OPENAI_MODEL: "claude-sonnet-4"
  
  # Elasticsearch Configuration
  ES_HOST: {{ .Values.secrets.elasticsearch.host | quote }}
  ES_USER: {{ .Values.secrets.elasticsearch.user | quote }}
  ES_PASSWORD: {{ .Values.secrets.elasticsearch.password | quote }}
  
  # JWT Authentication
  JWT_SECRET_KEY: "d6dc1601f299859b2e823b471b76a17c431c48b5de6044f903495c32b8a1438f"
  JWT_ALGORITHM: "HS256"
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"
  
  # Default Admin Password
  DEFAULT_ADMIN_PASSWORD: "admin123"
  
  # Service-to-Service Authentication
  MCP_SERVICE_TOKEN: "8623da62fb54f7b0bebc182ad3deeea82a21a430818defb6be61fb0bbab07149"
  
  # ChromaDB Configuration
  CHROMA_MODE: "standalone"
  CHROMA_HOST: "argus-chromadb"
  CHROMA_PORT: "8000"
  
  # Environment Configuration
  ENVIRONMENT: "development"
  LOG_LEVEL: "INFO"
  
  # Timeouts Configuration
  ES_TIMEOUT: "30"
  API_TIMEOUT_INITIAL: "120"
  API_TIMEOUT_DEEP_DIVE: "120"
  API_TIMEOUT_CHAT: "120"
  API_TIMEOUT_LOG_EXPLAIN: "30"
  
  # MCP Server URL
  MCP_SERVER_URL: "http://argus-mcp-server:8002/mcp/"
  
  # PostgreSQL Database
  POSTGRES_HOST: "argus-postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "argus"
  POSTGRES_PASSWORD: "argus123"
  POSTGRES_DB: "argus_auth"
{{- end }}
