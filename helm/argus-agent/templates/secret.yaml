{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "argus-agent.fullname" . }}-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "argus-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  GOOGLE_API_KEY: {{ .Values.secrets.googleApiKey | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  ES_HOST: {{ .Values.secrets.elasticsearch.host | quote }}
  ES_USER: {{ .Values.secrets.elasticsearch.user | quote }}
  ES_PASSWORD: {{ .Values.secrets.elasticsearch.password | quote }}
{{- end }}
