{{- if .Values.ingress.app.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "argus-agent.fullname" . }}-app
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "argus-agent.labels" . | nindent 4 }}
    component: app
  {{- with .Values.ingress.app.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.app.className }}
  ingressClassName: {{ .Values.ingress.app.className }}
  {{- end }}
  {{- if .Values.ingress.app.tls }}
  tls:
    {{- range .Values.ingress.app.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.app.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "argus-agent.fullname" $ }}-app
                port:
                  number: {{ $.Values.app.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
---
{{- if .Values.ingress.mcpServer.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
