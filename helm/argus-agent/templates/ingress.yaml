{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "argus-agent.fullname" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "argus-agent.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      # Auth Path (must come before / to avoid being caught by UI)
      {{- if .Values.api.enabled }}
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: {{ include "argus-agent.fullname" . }}-api
            port:
              number: {{ .Values.api.service.port }}
      {{- end }}
      # API Path
      {{- if .Values.api.enabled }}
      - path: {{ .Values.ingress.paths.api.path }}
        pathType: {{ .Values.ingress.paths.api.pathType }}
        backend:
          service:
            name: {{ include "argus-agent.fullname" . }}-api
            port:
              number: {{ .Values.api.service.port }}
      {{- end }}
      # MCP Server Path
      {{- if .Values.mcpServer.enabled }}
      - path: {{ .Values.ingress.paths.mcp.path }}
        pathType: {{ .Values.ingress.paths.mcp.pathType }}
        backend:
          service:
            name: {{ include "argus-agent.fullname" . }}-mcp-server
            port:
              number: {{ .Values.mcpServer.service.port }}
      {{- end }}
      # UI Path (must be last to match / as catch-all)
      {{- if .Values.ui.enabled }}
      - path: {{ .Values.ingress.paths.ui.path }}
        pathType: {{ .Values.ingress.paths.ui.pathType }}
        backend:
          service:
            name: {{ include "argus-agent.fullname" . }}-ui
            port:
              number: {{ .Values.ui.service.port }}
      {{- end }}
{{- end }}
