    {{- range .Values.ingress.mcpServer.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.mcpServer.hosts }}
    - host: {{ .host | quote }}
      http:
