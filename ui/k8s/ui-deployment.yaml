apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-ui
  namespace: argus-dev
  labels:
    app: argus-ui
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: argus-ui
  template:
    metadata:
      labels:
        app: argus-ui
        component: frontend
    spec:
      containers:
      - name: frontend
        image: southamerica-east1-docker.pkg.dev/tcloud-devops/tcloud-devops/argus-ui:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
      imagePullSecrets:
      - name: gcr-json-key
---
apiVersion: v1
kind: Service
metadata:
  name: argus-ui
  namespace: argus-dev
  labels:
    app: argus-ui
    component: frontend
spec:
  type: LoadBalancer
  selector:
    app: argus-ui
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  sessionAffinity: None
