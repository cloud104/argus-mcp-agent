<div class="change-password-container">
  <div class="cp-card">
    <div class="cp-header">
      <div class="cp-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 11c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm0 2c-3.866 0-7 2.239-7 5v2h14v-2c0-2.761-3.134-5-7-5z"/>
        </svg>
      </div>
      <div class="cp-title">Alterar Senha</div>
      <div class="cp-subtitle">Atualize sua senha com segurança. Mínimo de 8 caracteres.</div>
    </div>

    @if (successMessage()) {
      <div class="totvs-alert totvs-alert--success">{{ successMessage() }}</div>
    }
    @if (errorMessage()) {
      <div class="totvs-alert totvs-alert--danger">{{ errorMessage() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="cp-form">
      <div class="totvs-form-group">
        <label for="oldPassword">Senha Atual *</label>
        <input id="oldPassword" type="password" formControlName="oldPassword" class="totvs-input" placeholder="Digite sua senha atual" />
      </div>
      <div class="totvs-form-group">
        <label for="newPassword">Nova Senha *</label>
        <input id="newPassword" type="password" formControlName="newPassword" class="totvs-input" placeholder="Digite a nova senha" />
        <small class="hint">Mínimo de 8 caracteres</small>
      </div>
      <div class="cp-actions">
        <button type="submit" class="totvs-btn totvs-btn--primary" [disabled]="form.invalid || isLoading()">
          @if (isLoading()) { <div class="totvs-spinner totvs-spinner--sm"></div><span>Salvando...</span> } @else { <span>Salvar</span> }
        </button>
      </div>
    </form>
  </div>
</div>
