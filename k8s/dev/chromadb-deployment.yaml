apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-chromadb
  namespace: argus-dev
  labels:
    app: argus-chromadb
    component: database
    environment: development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argus-chromadb
  template:
    metadata:
      labels:
        app: argus-chromadb
        component: database
    spec:
      containers:
      - name: chromadb
        image: chromadb/chroma:latest
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: IS_PERSISTENT
          value: "TRUE"
        - name: ANONYMIZED_TELEMETRY
          value: "FALSE"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/v1/heartbeat
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/heartbeat
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: chroma-storage
          mountPath: /chroma/chroma
      volumes:
      - name: chroma-storage
        persistentVolumeClaim:
          claimName: argus-chroma-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: argus-chromadb
  namespace: argus-dev
  labels:
    app: argus-chromadb
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: argus-chromadb
