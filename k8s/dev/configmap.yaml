apiVersion: v1
kind: ConfigMap
metadata:
  name: argus-config
  namespace: argus-dev
data:
  # MCP Server URL
  MCP_SERVER_URL: "http://argus-mcp-server:8002/mcp/"

  # Application settings
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

  # Timeouts (em segundos)
  ES_TIMEOUT: "30"
  API_TIMEOUT_INITIAL: "120"
  API_TIMEOUT_DEEP_DIVE: "120"
  API_TIMEOUT_CHAT: "120"
  API_TIMEOUT_LOG_EXPLAIN: "30"

  # PostgreSQL Configuration
  POSTGRES_HOST: "argus-postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "argus_auth"

  # JWT Configuration
  JWT_ALGORITHM: "HS256"
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"
  DEFAULT_ADMIN_PASSWORD: "admin123"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argus-settings
  namespace: argus-dev
data:
  settings.json: |
    {
      "mcp_servers": {
        "tools": {
          "transport": "streamable_http",
          "url": "http://argus-mcp-server:8002/mcp/"
        }
      }
    }

  models.json: |
    {
      "planner_model": {
        "provider": "openai",
        "class_path": "langchain_openai.ChatOpenAI",
        "model_name": "gpt-4o-mini"
      },
      "synthesizer_model": {
        "provider": "openai",
        "class_path": "langchain_openai.ChatOpenAI",
        "model_name": "gpt-4o"
      },
      "gemini-pro": {
        "provider": "google",
        "class_path": "langchain_google_genai.ChatGoogleGenerativeAI",
        "model_name": "gemini-1.5-pro-latest"
      },
      "claude-haiku": {
        "provider": "anthropic",
        "class_path": "langchain_anthropic.ChatAnthropic",
        "model_name": "claude-3-haiku-20240307"
      },
      "chat_model": {
        "provider": "openai",
        "class_path": "langchain_openai.ChatOpenAI",
        "model_name": "claude-sonnet-4",
        "max_tokens": 4096
      }
    }
