apiVersion: v1
kind: Service
metadata:
  name: argus-mcp-server
  namespace: argus-dev
  labels:
    app: argus-mcp-server
spec:
  type: ClusterIP
  ports:
  - port: 8002
    targetPort: 8002
    protocol: TCP
    name: http
  - port: 5678
    targetPort: 5678
    protocol: TCP
    name: debug
  selector:
    app: argus-mcp-server
---
apiVersion: v1
kind: Service
metadata:
  name: argus-api
  namespace: argus-dev
  labels:
    app: argus-api
spec:
  type: LoadBalancer
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  - port: 5678
    targetPort: 5678
    protocol: TCP
    name: debug
  selector:
    app: argus-api
