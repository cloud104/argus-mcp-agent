apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-app
  namespace: argus-dev
  labels:
    app: argus-app
    component: frontend
    environment: development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argus-app
  template:
    metadata:
      labels:
        app: argus-app
        component: frontend
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
      - name: gcr-json-key
      containers:
      - name: app
        image: southamerica-east1-docker.pkg.dev/tcloud-devops/tcloud-devops/argus-app:latest
        imagePullPolicy: Always
        command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        - containerPort: 5678
          name: debug
          protocol: TCP
        env:
        - name: PYTHONUNBUFFERED
          valueFrom:
            configMapKeyRef:
              name: argus-config
              key: PYTHONUNBUFFERED
        - name: PYTHONDONTWRITEBYTECODE
          valueFrom:
            configMapKeyRef:
              name: argus-config
              key: PYTHONDONTWRITEBYTECODE
        - name: MCP_SERVER_URL
          value: "http://argus-mcp-server:8002/mcp/"
        envFrom:
        - secretRef:
            name: argus-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        startupProbe:
          httpGet:
            path: /health/startup
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8000
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
          readOnly: true
        - name: chroma-storage
          mountPath: /app/chroma_db
      volumes:
      - name: config-volume
        configMap:
          name: argus-settings
          items:
          - key: settings.json
            path: settings.json
          - key: models.json
            path: models.json
      - name: chroma-storage
        persistentVolumeClaim:
          claimName: argus-chroma-pvc
