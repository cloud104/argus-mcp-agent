services:
  # PostgreSQL - Authentication Database
  postgres:
    image: postgres:16-alpine
    container_name: argus-postgres
    ports:
      - "5433:5432"  # External:Internal - evita conflito com PostgreSQL local
    environment:
      - POSTGRES_USER=argus
      - POSTGRES_PASSWORD=argus123
      - POSTGRES_DB=argus_auth
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - argus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus_auth"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ChromaDB - Vector Database for RAG
  chromadb:
    image: chromadb/chroma:latest
    container_name: argus-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - argus-network

  # MCP Tool Server - Depende do ChromaDB (com delay)
  mcp-server:
    image: southamerica-east1-docker.pkg.dev/tcloud-devops/tcloud-devops/argus-mcp-server:latest
    container_name: argus-mcp-server
    ports:
      - "${MCP_SERVER_PORT:-8002}:8002"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - argus-network
    depends_on:
      chromadb:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Main Application - Depende do MCP Server e PostgreSQL
  app:
    image: southamerica-east1-docker.pkg.dev/tcloud-devops/tcloud-devops/argus-app:latest
    container_name: argus-app
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - argus-network
    depends_on:
      postgres:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  argus-network:
    driver: bridge

volumes:
  chroma_data:
  postgres_data:
