services:
  # ChromaDB - Deve iniciar primeiro
  chromadb:
    image: chromadb/chroma:latest
    container_name: argus-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - argus-network

  # MCP Tool Server - Depende do ChromaDB (com delay)
  mcp-server:
    image: southamerica-east1-docker.pkg.dev/tcloud-devops/tcloud-devops/argus-mcp-server:20251002-160242
    container_name: argus-mcp-server
    ports:
      - "${MCP_SERVER_PORT:-8002}:8002"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - argus-network
    depends_on:
      chromadb:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Main Application - Depende do MCP Server
  app:
    image: southamerica-east1-docker.pkg.dev/tcloud-devops/tcloud-devops/argus-app:20251002-160242
    container_name: argus-app
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - argus-network
    depends_on:
      mcp-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  argus-network:
    driver: bridge

volumes:
  chroma_data:
