apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-agent-postgres
  namespace: argus
  labels:
    helm.sh/chart: argus-agent-0.1.0
    app.kubernetes.io/name: argus-agent
    app.kubernetes.io/instance: argus-agent
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app: argus-postgres
    component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argus-agent
      app.kubernetes.io/instance: argus-agent
      app: argus-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argus-agent
        app.kubernetes.io/instance: argus-agent
        app: argus-postgres
        component: database
    spec:
      securityContext:
        fsGroup: 999
      containers:
      - name: postgres
        image: "postgres:16-alpine"
        imagePullPolicy: IfNotPresent
        ports:
        - name: postgres
          containerPort: 5432
          protocol: TCP
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: argus-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: argus-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: argus-secrets
              key: POSTGRES_DB
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - argus
            - -d
            - argus_auth
          failureThreshold: 3
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - argus
            - -d
            - argus_auth
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: argus-agent-postgres-pvc
