apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argus-agent
  namespace: argus
  labels:
    helm.sh/chart: argus-agent-0.1.0
    app.kubernetes.io/name: argus-agent
    app.kubernetes.io/instance: argus-agent
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "900"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "900"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "900"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
  - host: argus.sandbox.tcloud-devops.cloudtotvs.com.br
    http:
      paths:
      # Auth Path (must come before / to avoid being caught by UI)
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: argus-agent-api
            port:
              number: 8000
      # API Path
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: argus-agent-api
